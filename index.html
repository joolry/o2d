<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>JOOLRY Order FMS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen" class="screen login-screen">
    <div class="login-card">
      <div class="logo-wrap">
        <img id="brand-logo" src="https://script.google.com/macros/s/AKfycbzj2YUeTgk4hP58cd1GBGjzRSPE-xjhtBfnoxv2GpkaUzN-zB08WZsPqe8jTRiv9U9j/exec" alt="JOOLRY" onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block'" />
        <div id="logo-fallback" class="logo-text" style="display:none">JOOLRY</div>
      </div>
      <p class="login-sub">Order Flow Monitoring</p>
      <input id="login-user" type="text" placeholder="Username" autocomplete="username" />
      <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="login-btn" class="btn primary full" onclick="App.doLogin()">Sign in</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="app-screen" class="screen app-screen" style="display:none">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">JOOLRY</span>
        <span class="brand-tag">Order FMS</span>
      </div>
      <nav class="nav-tabs">
        <button class="nav-btn active" data-view="dashboard" onclick="App.setView('dashboard')">Dashboard</button>
        <button class="nav-btn" data-view="kanban" onclick="App.setView('kanban')">Kanban</button>
        <button class="nav-btn" data-view="table" onclick="App.setView('table')">Orders</button>
      </nav>
      <div class="top-actions">
        <button class="btn ghost sm" onclick="App.forceSync()" title="Clear cache & refresh">↻ Sync</button>
        <div class="user-chip">
          <span id="user-name">—</span>
          <small id="user-role"></small>
          <button class="btn-link" onclick="App.doLogout()">Logout</button>
        </div>
      </div>
    </header>

    <!-- DASHBOARD -->
    <section id="view-dashboard" class="view">
      <div class="stats-row" id="stats-row"></div>
      <div class="dash-grid">
        <div class="card">
          <h3>Orders by stage</h3>
          <div id="chart-stages" class="bar-chart"></div>
        </div>
        <div class="card">
          <h3>Delay overview</h3>
          <div id="chart-delay" class="bar-chart"></div>
        </div>
        <div class="card wide">
          <div class="card-head">
            <h3>Needs attention</h3>
            <button class="btn ghost sm" onclick="App.loadOrders()">Refresh</button>
          </div>
          <div id="attention-list" class="mini-list"></div>
        </div>
      </div>
    </section>

    <!-- KANBAN -->
    <section id="view-kanban" class="view" style="display:none">
      <div class="kanban-toolbar">
        <input id="kanban-search" type="search" placeholder="Search order / client…" oninput="App.renderKanban()" />
        <select id="kanban-filter" onchange="App.renderKanban()">
          <option value="open">Open only</option>
          <option value="all">All orders</option>
        </select>
      </div>
      <div id="kanban-board" class="kanban-board"></div>
    </section>

    <!-- TABLE -->
    <section id="view-table" class="view" style="display:none">
      <div class="table-toolbar">
        <input id="table-search" type="search" placeholder="Search…" oninput="App.renderTable()" />
        <select id="table-filter" onchange="App.renderTable()">
          <option value="open">Open</option>
          <option value="all">All</option>
          <option value="late">Late only</option>
        </select>
        <button class="btn ghost sm" onclick="App.loadOrders()">↻</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order</th>
              <th>Client</th>
              <th>Value</th>
              <th>City</th>
              <th>Stage</th>
              <th>Status</th>
              <th>Delay</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- DETAIL DRAWER -->
  <div id="detail-overlay" class="overlay" onclick="App.closeDetail()"></div>
  <aside id="detail-panel" class="drawer">
    <div class="drawer-head">
      <button class="btn-link" onclick="App.closeDetail()">← Close</button>
      <h2 id="d-title">Order</h2>
    </div>
    <div class="drawer-body">
      <div class="info-grid" id="d-info"></div>
      <h3>Line items</h3>
      <div id="d-items" class="items-box"></div>
      <h3>Boxes</h3>
      <div id="d-boxes"></div>
      <h3>Courier</h3>
      <div class="form-grid">
        <input id="d-courier" placeholder="Courier" />
        <input id="d-awb" placeholder="AWB / Tracking" />
        <select id="d-auto">
          <option value="No">Auto-Update: No</option>
          <option value="Yes">Auto-Update: Yes</option>
        </select>
        <button class="btn primary" onclick="App.saveCourier()">Save courier</button>
      </div>
    </div>
  </aside>

  <div id="toast" class="toast"></div>

  <script src="appconfig.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>

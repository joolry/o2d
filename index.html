<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Joolry Order FMS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <h1>Joolry</h1>
      <p class="sub">Order FMS</p>
      <input id="login-user" type="text" placeholder="Username" autocomplete="username" />
      <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="login-btn" class="btn primary" onclick="App.doLogin()">Login</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app-screen" class="screen" style="display:none">
    <header>
      <div class="brand">
        <strong>Joolry</strong> <span>Order FMS</span>
      </div>
      <div class="user-info">
        <span id="user-name"></span>
        <small id="user-role"></small>
        <button class="btn-link" onclick="App.doLogout()">Logout</button>
      </div>
    </header>

    <div class="filters">
      <button class="filter-btn active" data-filter="open" onclick="App.setFilter('open')">Open</button>
      <button class="filter-btn" data-filter="all" onclick="App.setFilter('all')">All</button>
      <button class="btn-sm" onclick="App.loadOrders()">↻</button>
    </div>

    <div id="orders-list" class="orders-list"></div>
  </div>

  <!-- DETAIL PANEL (slide-up) -->
  <div id="detail-panel" class="detail-panel">
    <div class="detail-header">
      <button class="btn-link" onclick="App.closeDetail()">← Back</button>
      <h2 id="d-title">Order</h2>
    </div>
    <div class="detail-body">
      <div class="info-grid">
        <div><label>Client</label><div id="d-client">—</div></div>
        <div><label>Phone</label><div id="d-phone">—</div></div>
        <div class="full"><label>Address</label><div id="d-address">—</div></div>
        <div><label>Value</label><div id="d-value">—</div></div>
        <div><label>Payment</label><div id="d-payment">—</div></div>
        <div><label>Status</label><div id="d-status">—</div></div>
        <div><label>Current</label><div id="d-current">—</div></div>
      </div>

      <h3>Items</h3>
      <div id="d-items" class="items-box"></div>

      <h3>Boxes</h3>
      <div id="d-boxes"></div>

      <h3>Courier</h3>
      <div class="courier-form">
        <input id="d-courier" placeholder="Courier name" />
        <input id="d-awb" placeholder="AWB / Tracking No" />
        <select id="d-auto">
          <option value="No">Auto-Update: No</option>
          <option value="Yes">Auto-Update: Yes</option>
        </select>
        <button class="btn primary" onclick="App.saveCourier()">Save Courier</button>
      </div>
    </div>
  </div>

  <script src="appconfig.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
